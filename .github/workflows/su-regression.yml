name: SU regression checks
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/su-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:migrations
      - run: npm run build
