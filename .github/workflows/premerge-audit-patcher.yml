name: premerge-audit-patcher

on:
  push:
    branches:
      - fix/pilot-blockers-20260910

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pilot-blockers-20260910
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-premerge-audit-fixes.mjs
      - run: npm run validate:migrations
      - run: npm test
      - run: npm run build
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No pre-merge patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppMonolith.jsx
          git commit -m "fix: reconcile closed project charges in customer ledger"
          git push origin HEAD:fix/pilot-blockers-20260910
