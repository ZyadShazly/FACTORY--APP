name: pilot-blocker-ui-fixes

on:
  push:
    branches:
      - fix/pilot-blockers-20260910

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pilot-blockers-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-pilot-blocker-ui-fixes.mjs
      - run: npm test
      - run: npm run build
      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No UI patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppMonolith.jsx src/assets/AssetsPage.jsx src/v23/workCalendar.jsx src/reporting/professionalExports.js
          git commit -m "fix: apply remaining pilot UI blocker patches"
          git push origin HEAD:fix/pilot-blockers-20260910
